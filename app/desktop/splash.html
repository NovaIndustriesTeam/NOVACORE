<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">
  <title>NovaCore</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #080a12; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif; color: #e8eefc;
      background: radial-gradient(circle at 30% 20%, #16203e 0%, #080a12 60%);
    }
    .card { text-align: center; user-select: none; }
    .mark {
      width: 96px; height: 96px; margin: 0 auto 26px; border-radius: 24px;
      background: linear-gradient(145deg, #0a1020, #1a2547);
      border: 1px solid rgba(56, 225, 255, .55);
      box-shadow: 0 0 42px rgba(56, 225, 255, .18);
      display: flex; align-items: center; justify-content: center;
      font-size: 54px; font-weight: 800; letter-spacing: -2px;
      background-clip: padding-box;
    }
    .mark span {
      background: linear-gradient(120deg, #f5fbff, #38e1ff);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    h1 { font-size: 24px; font-weight: 650; margin: 0 0 10px; letter-spacing: .3px; }
    p { margin: 0; color: #94a3c4; font-size: 14px; }
    .bar { width: 220px; height: 3px; margin: 26px auto 0; border-radius: 3px; background: #1b2440; overflow: hidden; }
    .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, transparent, #38e1ff, transparent);
      animation: slide 1.15s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
    #detail { margin-top: 14px; font-size: 12px; color: #64719a; min-height: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark"><span>N</span></div>
    <h1>NovaCore</h1>
    <p>Démarrage des services locaux…</p>
    <div class="bar"></div>
    <div id="detail"></div>
  </div>
</body>
</html>
